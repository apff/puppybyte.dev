# Jekyll site settings

title: PuppyByte
description: Paw-some apps dev

url: "https://puppybyte.dev"

# App Store Links
xpenses_app_store_url: "https://apps.apple.com/pt/app/xpenses-finances-tracker/id6743875432?l=en-GB"

plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

# Keep repo docs out of the published site. Setting this replaces the default
# exclude list (Jekyll 3 does not merge), so the entries Jekyll and
# github-pages excluded on their own are restated here.
exclude:
  - README.md
  - AGENTS.md
  - CNAME
  - Gemfile
  - Gemfile.lock
